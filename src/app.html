<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Paris by Maps | An Interactive Report</title>
		<meta
			name="description"
			content="An interactive report. Web development and data visualization by SandraViz."
		/>
		<meta name="robots" content="noindex, nofollow" />
		<!-- FONTS LOAD HERE, not via @import in fonts.css. An @import is only
		     found after the bundled CSS has downloaded and parsed, and the woff2
		     only after THAT stylesheet — three round trips, during which the
		     text painted in the fallback face and then visibly swapped.
		     Preconnect + a plain <link> start them with the HTML; `display=block`
		     hides text for the few ms the font takes instead of flashing a
		     different face. -->
		<link rel="preconnect" href="https://api.fontshare.com" />
		<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
		<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2&display=block" />
		<style>
			/* Pin Tailwind's cascade layer order before any bundled CSS loads.
			   Vite 8 (Rolldown) hoists the empty `@layer components;` statement above
			   `base` in the built CSS, which makes base styles beat component styles. */
			@layer properties, theme, base, components, utilities;

			html,
			body {
				height: 100%;
				margin: 0;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="height: 100%">
		<div id="app-root" style="display: contents; height: 100%">%sveltekit.body%</div>
	</body>
</html>
