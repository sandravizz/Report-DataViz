<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>IDA 2030: Cliff or no cliff? — An Interactive Report</title>
		<meta
			name="description"
			content="An interactive report by the Finance for Development Lab on IDA's growth, its financing, and whether disbursements face a cliff by 2030. Web development and data visualization by SandraViz."
		/>
		<meta name="robots" content="noindex, nofollow" />
		<!-- FONTS LOAD HERE, not via @import in fonts.css. An @import is only
		     found after the bundled CSS has downloaded and parsed, and the woff2
		     only after THAT stylesheet — three round trips, during which the
		     text painted in the fallback face and then visibly swapped.
		     Preconnect + a plain <link> start them with the HTML; the two Kapra
		     files are preloaded; `display=block` hides text for the few ms the
		     fonts take instead of flashing a different face. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=IBM+Plex+Mono:wght@500&display=block"
		/>
		<link rel="preload" href="/fonts/KapraNeue-RegularExpanded.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/KapraNeue-SemiBoldExpanded.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			/* Pin Tailwind's cascade layer order before any bundled CSS loads.
			   Vite 8 (Rolldown) hoists the empty `@layer components;` statement above
			   `base` in the built CSS, which makes base styles beat component styles. */
			@layer properties, theme, base, components, utilities;

			html,
			body {
				height: 100%;
				margin: 0;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="height: 100%">
		<div id="app-root" style="display: contents; height: 100%">%sveltekit.body%</div>
	</body>
</html>
